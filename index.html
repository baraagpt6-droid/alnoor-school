    function SmartEmojiBadge({ icon = "book", active = false, size = 44, onClick, label = "أيقونة" }) {
      const [burst, setBurst] = useState(false);
      const timerRef = useRef(null);

      useEffect(() => () => {
        if (timerRef.current) window.clearTimeout(timerRef.current);
      }, []);

      const trigger = (event) => {
        if (!onClick) return;
        setBurst(true);
        if (timerRef.current) window.clearTimeout(timerRef.current);
        timerRef.current = window.setTimeout(() => {
          setBurst(false);
          timerRef.current = null;
        }, 550);
        onClick(event);
      };

      const className = `relative shrink-0 rounded-2xl flex items-center justify-center select-none transition-transform duration-200 ${
        active
          ? "bg-gradient-to-br from-[#5A6B2F] to-[#3A2C1C] border-2 border-[#E8C84A] shadow-lg scale-105"
          : "bg-[var(--surface2)] border border-[var(--gold)]"
      } ${onClick ? "cursor-pointer hover:scale-105" : "cursor-default"}`;

      const content = (
        <>
          {burst && <span aria-hidden="true" className="absolute inset-0 rounded-2xl border-2 border-[#E8C84A] burst-ring pointer-events-none" />}
          <SmartGlyph name={icon} size={Math.round(size * 0.54)} color={active ? "#F0D25E" : "#E8C84A"} />
          <span aria-hidden="true" className={`absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full border border-[#2A2118] ${active ? "bg-[#E8C84A] badge-pulse" : "bg-[#7A8A44]"}`} />
        </>
      );

      if (onClick) {
        return <button type="button" aria-label={label} onClick={trigger} style={{ width: size, height: size }} className={className}>{content}</button>;
      }
      return <span aria-hidden="true" style={{ width: size, height: size }} className={className}>{content}</span>;
    }

    /* =========================================================================
       3. المختبر ثلاثي الأبعاد التفاعلي الحقيقي (Three.js 3D Interactive Lab)
    ========================================================================= */
    function Interactive3DLab({ modelType = "solar", autoRotate = true }) {
      const mountRef = useRef(null);
      const autoRotateRef = useRef(autoRotate);
      autoRotateRef.current = autoRotate;
      const [webglError, setWebglError] = useState(false);
      const [selectedPart, setSelectedPart] = useState("اسحب بإصبعك أو الفأرة لتدوير المجسم 360°");

      const partDescriptions = {
        solar: [
          "الشمس: نجم يقع في مركز المجموعة الشمسية ويمثل 99.8% من كتلتها.",
          "الأرض: الكوكب الثالث من حيث البعد عن الشمس والوحيد المعروف بوجود حياة.",
          "زحل: يتميز بحلقاته الجليدية والصخرية الواسعة حول خط استوائه."
        ],
        geometry: [
          "المكعب المنتظم: مجسم هندسي له 6 أوجه مربعة متطابقة و12 حرفاً و8 رؤوس.",
          "الهرم الرباعي: قاعدة مربعة وأربعة أوجه مثلثية تلتقي في قمة واحدة.",
          "الكرة الهندسية: سطح متماثل تبعد جميع نقاطه مسافة ثابتة عن المركز."
        ],
        cell: [
          "النواة: مركز التحكم الخلوي وتحتوي على المادة الوراثية (DNA).",
          "الميتوكوندريا: مصنع الطاقة في الخلية المسؤولة عن التنفس الخلوي.",
          "الغشاء البلازمي: غلاف مرن ينظم مرور المواد من وإلى الخلية."
        ]
      };

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;
        if (!window.THREE) {
          setWebglError(true);
          return;
        }

        let renderer;
        try {
          const width = Math.max(container.clientWidth || 320, 1);
          const height = 230;
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
          camera.position.z = 5.4;

          renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(width, height);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          renderer.domElement.setAttribute("aria-label", "مجسم تعليمي ثلاثي الأبعاد قابل للتدوير. استخدم أسهم لوحة المفاتيح لتغيير زاوية العرض.");
          renderer.domElement.setAttribute("role", "img");
          renderer.domElement.setAttribute("tabindex", "0");
          renderer.domElement.style.touchAction = "none";
          container.replaceChildren(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xfff9ec, 0.95);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xf0d25e, 1.3);
        dirLight.position.set(5, 6, 7);
        scene.add(dirLight);

        const group = new THREE.Group();
        scene.add(group);

        if (modelType === "solar") {
          const sun = new THREE.Mesh(
            new THREE.SphereGeometry(0.95, 32, 32),
            new THREE.MeshStandardMaterial({ color: 0xe8c84a, emissive: 0xc9a227, emissiveIntensity: 0.45 })
          );
          group.add(sun);

          const orbit1 = new THREE.Mesh(
            new THREE.RingGeometry(1.65, 1.69, 48),
            new THREE.MeshBasicMaterial({ color: 0xd8c69e, side: THREE.DoubleSide })
          );
          orbit1.rotation.x = Math.PI / 2.4;
          group.add(orbit1);

          const earth = new THREE.Mesh(
            new THREE.SphereGeometry(0.34, 24, 24),
            new THREE.MeshStandardMaterial({ color: 0x5a6b2f, roughness: 0.4 })
          );
          earth.position.set(1.67, 0.2, 0);
          group.add(earth);

          const saturn = new THREE.Mesh(
            new THREE.SphereGeometry(0.45, 24, 24),
            new THREE.MeshStandardMaterial({ color: 0xb07a3a })
          );
          saturn.position.set(-2.2, -0.25, 0.4);
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(0.58, 0.85, 32),
            new THREE.MeshBasicMaterial({ color: 0xf0d25e, side: THREE.DoubleSide })
          );
          ring.rotation.x = Math.PI / 3;
          saturn.add(ring);
          group.add(saturn);
        } else if (modelType === "geometry") {
          const cube = new THREE.Mesh(
            new THREE.BoxGeometry(1.55, 1.55, 1.55),
            new THREE.MeshStandardMaterial({ color: 0x5a6b2f, roughness: 0.35 })
          );
          const wire = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(1.58, 1.58, 1.58)),
            new THREE.LineBasicMaterial({ color: 0xf0d25e })
          );
          cube.add(wire);
          cube.position.x = -1.15;
          group.add(cube);

          const cone = new THREE.Mesh(
            new THREE.ConeGeometry(0.95, 1.75, 4),
            new THREE.MeshStandardMaterial({ color: 0x8a4a22, roughness: 0.4 })
          );
          cone.position.x = 1.25;
          group.add(cone);
        } else {
          const membrane = new THREE.Mesh(
            new THREE.SphereGeometry(1.75, 28, 28),
            new THREE.MeshStandardMaterial({ color: 0x5a6b2f, transparent: true, opacity: 0.38 })
          );
          group.add(membrane);
          const nucleus = new THREE.Mesh(
            new THREE.SphereGeometry(0.68, 24, 24),
            new THREE.MeshStandardMaterial({ color: 0x8a4a22 })
          );
          group.add(nucleus);
          const mito = new THREE.Group();
          const mitoMaterial = new THREE.MeshStandardMaterial({ color: 0xe8c84a });
          const mitoBody = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.55, 16), mitoMaterial);
          const mitoTop = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 10), mitoMaterial);
          const mitoBottom = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 10), mitoMaterial);
          mitoTop.position.y = 0.275;
          mitoBottom.position.y = -0.275;
          mito.add(mitoBody, mitoTop, mitoBottom);
          mito.position.set(0.95, 0.55, 0.4);
          mito.rotation.z = 0.7;
          group.add(mito);
        }

        let isDragging = false;
        let prevX = 0;
        let prevY = 0;
        let activePointerId = null;
        let animId = 0;
        const dom = renderer.domElement;

        const onPointerDown = (event) => {
          isDragging = true;
          activePointerId = event.pointerId;
          prevX = event.clientX;
          prevY = event.clientY;
          try { dom.setPointerCapture(event.pointerId); } catch (_) {}
        };
        const onPointerMove = (event) => {
          if (!isDragging || event.pointerId !== activePointerId) return;
          const dx = event.clientX - prevX;
          const dy = event.clientY - prevY;
          group.rotation.y += dx * 0.012;
          group.rotation.x += dy * 0.012;
          prevX = event.clientX;
          prevY = event.clientY;
        };
        const onPointerUp = (event) => {
          if (event.pointerId !== activePointerId) return;
          isDragging = false;
          activePointerId = null;
        };
        const onKeyDown = (event) => {
          const step = 0.12;
          if (event.key === "ArrowLeft") group.rotation.y -= step;
          else if (event.key === "ArrowRight") group.rotation.y += step;
          else if (event.key === "ArrowUp") group.rotation.x -= step;
          else if (event.key === "ArrowDown") group.rotation.x += step;
          else return;
          event.preventDefault();
        };
        dom.addEventListener("keydown", onKeyDown);
        dom.addEventListener("pointerdown", onPointerDown);
        dom.addEventListener("pointermove", onPointerMove);
        dom.addEventListener("pointerup", onPointerUp);
        dom.addEventListener("pointercancel", onPointerUp);
        dom.addEventListener("lostpointercapture", onPointerUp);

        const resize = () => {
          const nextWidth = Math.max(container.clientWidth || 320, 1);
          camera.aspect = nextWidth / 230;
          camera.updateProjectionMatrix();
          renderer.setSize(nextWidth, 230);
        };
        let resizeObserver = null;
        if (typeof ResizeObserver !== "undefined") {
          resizeObserver = new ResizeObserver(resize);
          resizeObserver.observe(container);
        } else {
          window.addEventListener("resize", resize);
        }

        const animate = () => {
          animId = requestAnimationFrame(animate);
          if (autoRotateRef.current && !isDragging) group.rotation.y += 0.008;
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          if (resizeObserver) resizeObserver.disconnect();
          else window.removeEventListener("resize", resize);
          dom.removeEventListener("keydown", onKeyDown);
          dom.removeEventListener("pointerdown", onPointerDown);
          dom.removeEventListener("pointermove", onPointerMove);
          dom.removeEventListener("pointerup", onPointerUp);
          dom.removeEventListener("pointercancel", onPointerUp);
          dom.removeEventListener("lostpointercapture", onPointerUp);
          scene.traverse((object) => {
            if (object.geometry && typeof object.geometry.dispose === "function") object.geometry.dispose();
            if (object.material) {
              const materials = Array.isArray(object.material) ? object.material : [object.material];
              materials.forEach((material) => material && typeof material.dispose === "function" && material.dispose());
            }
          });
          scene.clear();
          renderer.dispose();
          if (typeof renderer.forceContextLoss === "function") renderer.forceContextLoss();
          if (dom.parentNode === container) container.removeChild(dom);
        };
        } catch (error) {
          console.error("تعذر تشغيل مختبر WebGL", error);
          setWebglError(true);
          return undefined;
        }
      }, [modelType]);

      const notes = partDescriptions[modelType] || partDescriptions.solar;

      return (
        <div className="rounded-2xl border border-[var(--gold)] bg-[#1f1810] p-3 space-y-2.5">
          <div className="flex items-center justify-between text-xs font-bold text-[#F0D25E]">
            <span className="flex items-center gap-1.5">
              <SmartGlyph name="lab3d" size={16} color="#F0D25E" />
              مختبر المحاكاة ثلاثي الأبعاد (3D)
            </span>
            <span className="px-2 py-0.5 rounded-full bg-[#3d3120] text-[#f6ecd2]">تفاعلي باللمس</span>
          </div>
          {webglError ? (
            <div role="status" className="w-full min-h-[120px] rounded-xl p-4 flex items-center justify-center text-center text-sm font-bold text-[#F6ECD2] bg-[#2a2118]">
              تعذر تشغيل العرض ثلاثي الأبعاد على هذا الجهاز. يمكنك متابعة شرح الدرس من النصوص.
            </div>
          ) : (
            <div ref={mountRef} className="w-full h-[230px] rounded-xl overflow-hidden cursor-grab active:cursor-grabbing bg-gradient-to-b from-[#2a2118] to-[#17120c]" />
          )}
          <div className="flex flex-wrap gap-1.5">
            {notes.map((n, idx) => (
              <button
                key={idx}
                type="button"
                onClick={() => setSelectedPart(n)}
                className="text-xs font-bold px-2.5 py-1.5 rounded-xl bg-[var(--surface2)] text-[var(--ink)] border border-[var(--line)] hover:border-[var(--gold)]"
              >
                عنصر {idx + 1}
              </button>
            ))}
          </div>
          <div className="text-xs leading-6 p-2.5 rounded-xl bg-[var(--surface)] border border-[var(--line)] text-[var(--ink)] font-bold">
            {selectedPart}
          </div>
        </div>
      );
    }

    /* =========================================================================
       4. البيانات الأولية الكاملة للمنصة (الطلاب، الدروس، الواجبات، الإعلانات)
    ========================================================================= */
    const STORAGE_KEY = "alnoor_madrasti_v3_full";
    const AI_SETTINGS_KEY = "alnoor_ai_preferences_v1";
    const APP_VERSION = "2.0.0";
    const CLOUD_API_BASE = "https://br-falling-rain-azmx7t48-schoolapi.compute.c-3.ap-southeast-1.aws.neon.tech";

      const values = new Uint32Array(1);
      if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(values);

      return String(100000 + (values[0] % 900000));
    }

    function detectEmbeddedBrowser() {
      const userAgent = navigator.userAgent || "";
      const knownAppWebView = /ChatGPT|OpenAI|FBAN|FBAV|Instagram|Line\/|Telegram|Twitter|LinkedInApp|Snapchat|TikTok|Pinterest|;\s*wv\)|\bwv\b|WebView/i.test(userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(userAgent);
      const iosWebView = isIOS && !/Safari/i.test(userAgent);
      const androidWebView = /Android/i.test(userAgent) && /;\s*wv\)|Version\/[\d.]+.*Chrome\//i.test(userAgent);
      return knownAppWebView || iosWebView || androidWebView;
    }

    function detectStandaloneDisplay() {
      return Boolean(
        window.matchMedia?.("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
    }

          } catch (error) {
            if (cancelled) return;

              setCloudStatus("expired");

        })();
        return () => { cancelled = true; };

      const localSyncKeys = ["students","lessons","assignments","announcements","parentMessages","attendanceRecords","scheduleByGrade"];

        const previous = previousCloudDataRef.current || {};
        const changes = {};
        for (const key of localSyncKeys) {
          if (JSON.stringify(previous[key]) !== JSON.stringify(data[key])) changes[key] = data[key];
        }
        if (!Object.keys(changes).length) return;
        const timer = window.setTimeout(async () => {
          const ok = await pushCloudChanges(changes, cloudSession);
          if (ok) previousCloudDataRef.current = data;
        }, 800);
        return () => window.clearTimeout(timer);
      }, [data, cloudSession, previewMode, cloudRetry]);

      useEffect(() => {
        const onOnline = () => {
          setCloudStatus(cloudSession?.token ? "syncing" : "online");
          setCloudRetry((value) => value + 1);
          if (cloudSession?.token) pullCloudSnapshot(cloudSession).catch(() => {});
        };
        const onOffline = () => setCloudStatus("offline");
        window.addEventListener("online", onOnline);
        window.addEventListener("offline", onOffline);
        return () => { window.removeEventListener("online", onOnline); window.removeEventListener("offline", onOffline); };
      }, [cloudSession?.token]);

      // Neon Realtime notifications refresh an authenticated snapshot; periodic pull is the fallback.
      useEffect(() => {
        if (!cloudSession?.token || previewMode) return;
        let closed = false, client = null, subscription = null;
        const refresh = () => pullCloudSnapshot(cloudSession).catch(() => {});
        const poll = window.setInterval(refresh, 20000);
        (async () => {
          try {
            if (typeof window.AlnoorCreateRealtimeClient !== "function") return;
            const seal = await cloudRequest("/api/realtime/seal", { method:"POST", body:{}, token:cloudSession.token });
            if (closed) return;
            client = window.AlnoorCreateRealtimeClient({ url: CLOUD_REALTIME_URL });
            cloudRealtimeClientRef.current = client;
            subscription = client.subscribe(seal.sealed);
            subscription.onChange(() => refresh());
            subscription.onStateChange((state) => { if (state.status === "error") setCloudStatus("pending"); });
          } catch (error) {
            console.warn("Realtime subscription unavailable; periodic sync remains active.", error);
          }
        })();
        return () => {
          closed = true;
          window.clearInterval(poll);
          try { subscription?.unsubscribe?.(); client?.close?.(); } catch {}
          cloudRealtimeClientRef.current = null;
        };
      }, [cloudSession?.token, previewMode]);

      }, [aiSettings]);

      useEffect(() => () => {
        if (toastTimerRef.current) window.clearTimeout(toastTimerRef.current);
      }, []);

      useEffect(() => {
        let registration = null;
        let refreshing = false;        const onControllerChange = () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        };
        const onBeforeInstallPrompt = (event) => {
          event.preventDefault();
          setInstallPrompt(event);

        // Keep install-prompt listeners active even when an in-app browser blocks Service Workers.
        window.addEventListener("beforeinstallprompt", onBeforeInstallPrompt);
        window.addEventListener("appinstalled", onAppInstalled);

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.addEventListener("controllerchange", onControllerChange);
          navigator.serviceWorker.register("./sw.js", { scope: "./" }).then((reg) => {
            registration = reg;
            swRegistrationRef.current = reg;
            setPwaReady(true);
            setPwaUpdateAvailable(Boolean(reg.waiting));
            reg.addEventListener("updatefound", () => {
              const worker = reg.installing;
              if (!worker) return;
              worker.addEventListener("statechange", () => {
                if (worker.state === "installed" && navigator.serviceWorker.controller) setPwaUpdateAvailable(true);
              });
            });
          }).catch((error) => console.warn("تعذر تسجيل Service Worker", error));
        }

        return () => {
          window.removeEventListener("beforeinstallprompt", onBeforeInstallPrompt);
          window.removeEventListener("appinstalled", onAppInstalled);
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.removeEventListener("controllerchange", onControllerChange);

      const cloudRequest = async (path, options = {}) => {
        const headers = new Headers(options.headers || {});
        headers.set("Accept", "application/json");
        if (options.body !== undefined) headers.set("Content-Type", "application/json");
        const token = options.token ?? cloudSession?.token;
        if (token) headers.set("Authorization", `Bearer ${token}`);
        const response = await fetch(CLOUD_API_BASE + path, {
          method: options.method || "GET",
          headers,
          body: options.body === undefined ? undefined : JSON.stringify(options.body),
          cache: "no-store"
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          const error = new Error(result.error || `Cloud API ${response.status}`);
          error.status = response.status;
          error.code = result.code;
          throw error;
        }
        return result;
      };

      const applyCloudSnapshot = (snapshot) => {

            setRole(null);

          const updated = { ...current, entries: { ...(current.entries || {}), [studentId]: status } };

          else records.push(updated);
          return { ...prev, attendanceRecords: records, students: recalculateAttendanceStudents(prev.students, records) };

          const entries = Object.fromEntries(prev.students.filter((student) => student.grade === teacherCurriculumGrade).map((student) => [student.id, "present"]));

          const current = recordIndex >= 0 ? records[recordIndex] : { id: `${teacherCurriculumGrade}-${attendanceDate}`, grade: teacherCurriculumGrade, date: attendanceDate, entries: {} };
          const updated = { ...current, entries: { ...(current.entries || {}), ...entries } };
          if (recordIndex >= 0) records[recordIndex] = updated;
          else records.push(updated);
          return { ...prev, attendanceRecords: records, students: recalculateAttendanceStudents(prev.students, records) };
        });
        notify("تم تسجيل طلاب الصف كحاضرين لهذا اليوم. يمكنك تعديل حالات الغياب والتأخر.");
      };

      const submitLessonQuiz = (lesson, quiz, quizIndex) => {
        const key = `${lesson.id}:${quiz.id || quizIndex}`;
        const choice = quizAnswers[key];
        if (choice === undefined || choice === null || choice === "") { notify("اختر إجابة قبل التصحيح"); return; }
        const correct = Number(choice) === Number(quiz.correctIndex);
        const rewardKey = `${currentStudent.id}:${quiz.id || quizIndex}`;
        const alreadyRewarded = (lesson.quizCompletedBy || []).includes(rewardKey);
        setQuizResults((prev) => ({ ...prev, [key]: { correct, answer: quiz.correctIndex } }));
        if (correct && !alreadyRewarded) {
          setData((prev) => ({
            ...prev,
            lessons: prev.lessons.map((item) => item.id === lesson.id ? { ...item, quizCompletedBy: [...new Set([...(item.quizCompletedBy || []), rewardKey])] } : item),
            students: prev.students.map((student) => student.id === currentStudent.id ? { ...student, points: (Number(student.points) || 0) + (Number(quiz.xp) || 10) } : student)
          }));
          notify(`إجابة صحيحة. حصلت على +${Number(quiz.xp) || 10} XP`);
        } else {
          notify(correct ? "إجابة صحيحة. سبق احتساب نقاط هذا الاختبار." : "ليست الإجابة الصحيحة. راجع محتوى الدرس وحاول مرة أخرى.");
        }
      };

      const addQuestionToActiveLesson = () => {
        const question = newQuizQuestion.trim().slice(0, 240);
        const options = newQuizOptions.map((value) => value.trim().slice(0, 180));
        if (!question || options.some((option) => !option)) { notify("اكتب السؤال والخيارات الثلاثة أولاً"); return; }
        const quiz = { id: `Q-${Date.now()}`, question, options, correctIndex: newQuizCorrectIndex, xp: 10 };
        setData((prev) => ({ ...prev, lessons: prev.lessons.map((lesson) => lesson.id === activeLesson.id ? { ...lesson, questions: [...(lesson.questions || []), quiz] } : lesson) }));
        setNewQuizQuestion(""); setNewQuizOptions(["", "", ""]); setNewQuizCorrectIndex(0);
        notify("أضيف السؤال إلى بنك اختبارات الدرس في هذا المتصفح");
      };

      useEffect(() => {
        if (!currentStudent) return;
        if (activeLesson && activeLesson.grade && activeLesson.grade !== currentStudent.grade) {
          const firstForGrade = data.lessons.find((lesson) => lesson.grade === currentStudent.grade);
          if (firstForGrade) { setActiveLessonId(firstForGrade.id); setActiveSentenceIdx(0); }
        }
      }, [currentStudent?.grade, activeLesson?.grade, data.lessons]);

      const visibleStudentLessons = useMemo(() => {
        const q = lessonSearch.trim().toLocaleLowerCase("ar");
        return data.lessons.filter((lesson) => {
          if (lesson.grade && lesson.grade !== currentStudent.grade) return false;
          if (lessonSubjectFilter !== "الكل" && lesson.subject !== lessonSubjectFilter) return false;
          if (!q) return true;
          const content = [lesson.title, lesson.subject, ...(lesson.sentences || []).map((sentence) => sentence.text), ...(lesson.sentences || []).map((sentence) => sentence.hint || "")].join(" ").toLocaleLowerCase("ar");
          return content.includes(q);
        });
      }, [data.lessons, currentStudent.grade, lessonSearch, lessonSubjectFilter]);

      const visibleTeacherLessons = useMemo(() => {
        const q = teacherLessonSearch.trim().toLocaleLowerCase("ar");
        return data.lessons.filter((lesson) => {
          if (lesson.grade && lesson.grade !== teacherCurriculumGrade) return false;
          if (teacherLessonSubjectFilter !== "الكل" && lesson.subject !== teacherLessonSubjectFilter) return false;
          if (!q) return true;
          return [lesson.title, lesson.subject, ...(lesson.sentences || []).map((sentence) => sentence.text)].join(" ").toLocaleLowerCase("ar").includes(q);
        });
      }, [data.lessons, teacherCurriculumGrade, teacherLessonSearch, teacherLessonSubjectFilter]);

      const visibleStudentAssignments = useMemo(() => data.assignments.filter((assignment) => !assignment.grade || assignment.grade === currentStudent.grade), [data.assignments, currentStudent.grade]);

      const handleCheckForUpdates = async () => {
        try {
          const registration = swRegistrationRef.current || await navigator.serviceWorker?.getRegistration("./");
          if (!registration) { notify("تحديثات التطبيق متاحة بعد فتحه عبر HTTPS أو localhost"); return; }
          await registration.update();
          if (registration.waiting) {
            setPwaUpdateAvailable(true);
            registration.waiting.postMessage({ type: "SKIP_WAITING" });
            notify("يجري تثبيت التحديث وإعادة فتح التطبيق");
          } else {
            setPwaUpdateAvailable(false);
            notify("التطبيق على آخر إصدار متاح");
          }
        } catch (error) {
          console.warn("تعذر التحقق من تحديث التطبيق", error);
          notify("تعذر التحقق من التحديث. تحقق من الاتصال بالإنترنت.");
        }
      };

      const handleInstallApp = async () => {
        if (appInstalled || isStandaloneApp) {
          notify("تطبيق مدرسة النور مثبت بالفعل على جهازك");
          return;
        }

        if (isEmbeddedBrowser) {
          setShowInstallGuidance(true);
          notify("افتح الرابط في المتصفح لتثبيت التطبيق");
          return;
        }

        if (!installPrompt) {
          setShowInstallGuidance(true);
          const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || "");
          notify(isIOS ? "استخدم زر المشاركة في Safari ثم اختر إضافة إلى الشاشة الرئيسية" : "افتح قائمة المتصفح واختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية");
          return;
        }

        const promptEvent = installPrompt;
        setInstallPrompt(null);
        try {
          await promptEvent.prompt();
          const choice = await promptEvent.userChoice;
          if (choice?.outcome === "accepted") {
            notify("تم قبول تثبيت مدرسة النور");
          } else {
            notify("يمكنك تثبيت التطبيق في أي وقت من هذا الزر");
          }
        } catch (error) {
          console.warn("تعذر فتح نافذة التثبيت", error);
          setShowInstallGuidance(true);
          notify("تعذر فتح نافذة التثبيت. افتح قائمة المتصفح لإضافة التطبيق إلى الشاشة الرئيسية.");
        }
      };

      const selectLoginRole = (targetRole) => {
        const credentials = DEMO_CREDENTIALS[targetRole] || DEMO_CREDENTIALS.student;
        setLoginTab(targetRole);
        setLoginId(credentials.id);
        setLoginSecret(credentials.secret);
        setLoginError("");
      };

      const loginWithCredentials = (selectedRole, rawId, rawSecret) => {
        const idClean = String(rawId || "").trim().toUpperCase();
        const secClean = String(rawSecret || "").trim();

        if (selectedRole === "student") {
          const st = data.students.find((s) => String(s.id || "").toUpperCase() === idClean && String(s.pin || "") === secClean);
          if (!st) return setLoginError("تعذر تسجيل الدخول. تحقق من البيانات وحاول مجدداً.");
          setActiveStudentId(st.id);
          setActiveLessonId(data.lessons.find((lesson) => lesson.grade === st.grade)?.id || data.lessons[0]?.id || "L1");
          setLessonSearch("");
          setLessonSubjectFilter("الكل");
          setRole("student");
          notify(`أهلاً بك يا ${st.name.split(" ")[0]}`);
        } else if (selectedRole === "parent") {
          const st = data.students.find((s) => String(s.id || "").toUpperCase() === idClean && String(s.parentPhone || "") === secClean);
          if (!st) return setLoginError("تعذر التحقق من بيانات ولي الأمر. تحقق من البيانات وحاول مجدداً.");
          setActiveStudentId(st.id);
          setActiveLessonId(data.lessons.find((lesson) => lesson.grade === st.grade)?.id || data.lessons[0]?.id || "L1");
          setRole("parent");
          notify("تم الدخول إلى بوابة ولي الأمر بنجاح");
        } else if (selectedRole === "teacher") {
          if (idClean === "TCH-01" && secClean === "1111") {
            setRole("teacher");
            notify("مرحباً بك في بوابة المعلم");
          } else {
            setLoginError("تعذر تسجيل الدخول. تحقق من البيانات وحاول مجدداً.");
          }
        } else if (selectedRole === "admin") {
          if (idClean === "ADM-01" && secClean === "0000") {
            setRole("admin");
            notify("تم تسجيل الدخول بصلاحية المشرف العام");
          } else {
            setLoginError("تعذر تسجيل الدخول. تحقق من البيانات وحاول مجدداً.");
          }
        }
      };

      const handleSmartLogin = (e) => {
        e.preventDefault();
        loginWithCredentials(loginTab, loginId, loginSecret);
      };

      const handleQuickDemoLogin = () => {
        const credentials = DEMO_CREDENTIALS[loginTab] || DEMO_CREDENTIALS.student;
        setLoginId(credentials.id);
        setLoginSecret(credentials.secret);
        setLoginError("");
        loginWithCredentials(loginTab, credentials.id, credentials.secret);
      };

      const handleReadSentence = (sentenceObj, idx) => {
        setActiveSentenceIdx(idx);
        if (speechEnabled && sentenceObj && typeof sentenceObj.text === "string" && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(sentenceObj.text.slice(0, 4000));
          utter.lang = "ar-SA";
          utter.rate = 0.95;
          window.speechSynthesis.speak(utter);
        }
      };

      const completeLesson = (lesson) => {
        let alreadyCompleted = false;
        setData((prev) => {
          const existing = prev.lessons.find((item) => item.id === lesson.id);
          if (!existing || !Array.isArray(existing.completedBy)) return prev;
          if (existing.completedBy.includes(currentStudent.id)) {
            alreadyCompleted = true;
            return prev;
          }
          return {
            ...prev,
            lessons: prev.lessons.map((item) => item.id === lesson.id
              ? { ...item, completedBy: [...item.completedBy, currentStudent.id] }
              : item),
            students: prev.students.map((student) => student.id === currentStudent.id
              ? { ...student, points: (Number(student.points) || 0) + (Number(lesson.xp) || 0) }
              : student)
          };
        });
        notify(alreadyCompleted ? "هذا الدرس مكتمل مسبقاً في سجلك" : `أحسنت! حصلت على +${lesson.xp} نقطة تميز`);
      };

      const submitAssignmentAnswer = (assign, optionIdx) => {
        const isCorrect = optionIdx === assign.correctIndex;
        const previousSubmission = assign.submissions && assign.submissions[currentStudent.id];
        const wasAlreadyCorrect = Boolean(previousSubmission?.isCorrect || previousSubmission?.rewarded);
        const shouldAward = isCorrect && !wasAlreadyCorrect;
        setData((prev) => ({
          ...prev,
          assignments: prev.assignments.map((item) => item.id === assign.id
            ? {
                ...item,
                submissions: {
                  ...(item.submissions || {}),
                  [currentStudent.id]: {
                    optionIdx,
                    isCorrect,
                    rewarded: Boolean(previousSubmission?.rewarded || previousSubmission?.isCorrect || shouldAward)
                  }
                }
              }
            : item),
          students: shouldAward
            ? prev.students.map((student) => student.id === currentStudent.id
                ? { ...student, points: (Number(student.points) || 0) + (Number(assign.xp) || 0) }
                : student)
            : prev.students
        }));
        notify(isCorrect
          ? (shouldAward ? `إجابة صحيحة! أُضيفت +${assign.xp} نقطة` : "إجابة صحيحة، وقد سبق احتساب مكافأة هذا الواجب")
          : "تم تسجيل إجابتك، راجع الدرس وحاول مجدداً");
      };

      const buildLocalAssistantReply = (question) => {
        const q = String(question || "").toLocaleLowerCase("ar");
        const marks = Array.isArray(currentStudent?.marks) ? currentStudent.marks : [];
        const avg = marks.length ? Math.round(marks.reduce((sum, mark) => sum + (Number(mark.termWork) || 0) + (Number(mark.finalExam) || 0), 0) / marks.length) : 0;
        const lessonText = (activeLesson?.sentences || []).map((sentence) => sentence.text).join(" ");
        const significantWords = q.split(/[\s،,.!?؟]+/).filter((word) => word.length > 2);
        const matches = (data.lessons || []).filter((lesson) => {
          const haystack = [lesson.title, lesson.subject, ...(lesson.sentences || []).map((sentence) => sentence.text)].join(" ").toLocaleLowerCase("ar");
          return significantWords.some((word) => haystack.includes(word));
        }).slice(0, 3);
        if (q.includes("معدل") || q.includes("درج") || q.includes("كشف")) {
          return `المعدل المحلي للطالب ${avg}%. مجموع كل مادة = أعمال السنة من 40 + الاختبار النهائي من 60. هذه بيانات محفوظة على الجهاز وليست سجلاً مدرسياً معتمداً.`;
        }
        if (q.includes("واجب") || q.includes("مهام")) {
          const items = (data.assignments || []).filter((item) => !item.grade || item.grade === currentStudent?.grade);
          return items.length ? "الواجبات المسجلة محلياً:\n" + items.map((item, index) => `${index + 1}. ${item.title} — ${item.subject}`).join("\n") : "لا توجد واجبات محفوظة لهذا الصف على هذا الجهاز.";
        }
        if (q.includes("حضور") || q.includes("غياب")) {
          const records = (data.attendanceRecords || []).filter((record) => record.entries?.[currentStudent?.id]);
          const present = records.filter((record) => ["present", "late"].includes(record.entries[currentStudent.id])).length;
          return `سجلات الحضور المحلية: ${records.length}. الحضور والتأخر: ${present}. نسبة الحضور المحفوظة: ${currentStudent?.attendance || 0}%.`;
        }
        if (q.includes("تلخيص") || q.includes("لخص") || q.includes("اشرح") || q.includes("درس")) {
          if (matches.length && !lessonText) return matches.map((lesson) => `${lesson.title} — ${lesson.subject}: ${(lesson.sentences || []).map((sentence) => sentence.text).join(" ")}`).join("\n\n");
          return lessonText ? `شرح الدرس «${activeLesson.title}» — ${activeLesson.subject}: ${lessonText}` : "افتح درساً يحتوي على نصوص حتى أتمكن من عرض محتواه.";
        }
        if (q.includes("اختبار") || q.includes("سؤال") || q.includes("تقويم")) {
          const lines = (activeLesson?.sentences || []).slice(0, 3).map((sentence, index) => `${index + 1}. اكتب سؤالاً يختبر فهم الفكرة التالية: ${sentence.text}`);
          return lines.length ? `أسئلة تدريبية أولية من محتوى الدرس:\n${lines.join("\n")}\nراجع صياغتها مع المعلم قبل اعتمادها.` : "لا يوجد محتوى كافٍ لتوليد أسئلة من الدرس الحالي.";
        }
        if (q.includes("جدول")) {
          const gradeSchedule = data.scheduleByGrade?.[currentStudent?.grade] || data.schedule || [];
          const days = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
          const lines = days.map((day) => {
            const row = gradeSchedule.find((item) => item?.day === day);
            return row ? `${day}: ${row.classes || row.subjects || "لم تُحدد الحصص"}` : `${day}: لا يوجد جدول محفوظ`;
          });
          return `جدول الصف ${currentStudent?.grade || "الحالي"} في هذه النسخة المحلية:\n${lines.join("\n")}`;
        }
        if (matches.length) return "وجدت هذه المعلومات في دروس هذا الجهاز:\n" + matches.map((lesson) => `${lesson.title} — ${lesson.subject}: ${(lesson.sentences || []).map((sentence) => sentence.text).join(" ")}`).join("\n\n");
        if (role === "parent") return `ملخص متابعة محلي: الصف ${currentStudent.grade}، الحضور ${currentStudent.attendance}%. لا تعرض هذه النسخة بيانات معتمدة.`;
        if (role === "teacher" || role === "admin") return `يمكنك استخدام بوابة المعلم لإضافة درس وصف ومادة، أو إنشاء واجب تفاعلي. عدد الدروس المتاحة محلياً ${data.lessons.length}.`;
        return "الاتصال غير متاح حالياً. أستطيع البحث في الدروس والواجبات والحضور والجداول المحفوظة على هذا الجهاز.";
      };

      const requestRemoteAssistant = async (question) => {
        const lessonText = (activeLesson?.sentences || []).map((sentence) => sentence.text).join("\n").slice(0, 2200);
        const system = [
          "أنت مساعد نور التعليمي لمدرسة يمنية. أجب بالعربية الواضحة وبأسلوب يناسب الطالب أو ولي الأمر أو المعلم حسب البوابة.",
          "أجب عن أسئلة المنهج اليمني والأسئلة العامة. في الرياضيات اشرح الخطوات. في النحو اذكر القاعدة والمثال.",
          "لا تخترع نصوص الكتب أو أرقام الصفحات. إذا لم تتوفر معلومة موثوقة فقل ذلك بوضوح.",
          "معلومات الدرس المفتوح المتاحة: " + (activeLesson?.title || "لا يوجد درس محدد") + "، المادة: " + (activeLesson?.subject || "غير محددة") + ".",
          lessonText ? "مقتطف الدرس: " + lessonText : "لا يوجد نص درس مرفق."
        ].join("\n");
        const controller = typeof AbortController !== "undefined" ? new AbortController() : null;
        const timer = controller ? window.setTimeout(() => controller.abort(), 15000) : null;
        try {
          if (navigator.onLine === false) throw new Error("الجهاز غير متصل بالإنترنت.");
          const proxyUrl = String(aiSettings.proxyUrl || "").trim();
          if (proxyUrl) {
            const response = await fetch(proxyUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json", "Accept": "application/json" },
              body: JSON.stringify({
                question,
                system,
                context: { role, grade: currentStudent?.grade || "", lesson: activeLesson?.title || "", subject: activeLesson?.subject || "" }
              }),
              signal: controller?.signal
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(payload?.error || `Proxy HTTP ${response.status}`);
            const output = payload.reply || payload.answer || payload.output || payload.choices?.[0]?.message?.content;
            if (typeof output !== "string" || !output.trim()) throw new Error("لم يرجع الخادم الوسيط رداً نصياً.");
            return output.trim();
          }

          // Legacy OpenAI-compatible free endpoint. Best-effort anonymous access only;
          // if this public route is changed or rate-limited, the caller uses local lessons.
          const response = await fetch("https://text.pollinations.ai/openai", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({
              model: "openai-fast",
              messages: [
                { role: "system", content: system },
                { role: "user", content: String(question).slice(0, 500) }
              ],
              temperature: 0.45,
              max_tokens: 1100
            }),
            signal: controller?.signal
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(payload?.error?.message || payload?.error || `Pollinations HTTP ${response.status}`);
          const output = payload?.choices?.[0]?.message?.content || payload.reply || payload.answer || payload.text;
          if (typeof output !== "string" || !output.trim()) throw new Error("خدمة الإجابة لم ترجع نصاً.");
          return output.trim().slice(0, 9000);
        } finally {
          if (timer) window.clearTimeout(timer);
        }
      };

      const sendAiMessage = async (customPrompt) => {
        const q = String(customPrompt || aiInput).trim().slice(0, 500);
        if (!q || !role || aiBusy) return;
        setAiInput("");
        setAiHistoryByRole((prev) => ({ ...prev, [role]: [...(prev[role] || []), { sender: "user", text: q }] }));
        setAiBusy(true);
        let reply = "";
        try {
          reply = await requestRemoteAssistant(q);
        } catch (error) {
          console.warn("تعذر الوصول إلى مساعد نور عبر الإنترنت، تم استخدام المحتوى المحلي.", error);
          reply = "تعذر الاتصال بخدمة الذكاء الاصطناعي الآن. استخدمت قاعدة الدروس والمعلومات المحفوظة على هذا الجهاز.\n\n" + buildLocalAssistantReply(q);
        } finally {
          const answer = reply || buildLocalAssistantReply(q);
          setAiHistoryByRole((prev) => ({ ...prev, [role]: [...(prev[role] || []), { sender: "ai", text: answer }] }));
          setAiBusy(false);
        }
      };

      const speakAiReply = (value) => {
        const text = String(value || "").trim().slice(0, 4000);
        if (!text) return;
        if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
          setToast("ميزة القراءة الصوتية غير مدعومة في هذا المتصفح.");
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ar-SA";
        utterance.rate = 0.94;
        const arabicVoice = window.speechSynthesis.getVoices().find((voice) => /^ar([_-]|$)/i.test(voice.lang || ""));
        if (arabicVoice) utterance.voice = arabicVoice;
        window.speechSynthesis.speak(utterance);
      };

      const getGradeLabel = (total) => {
        if (total >= 90) return "ممتاز";
        if (total >= 80) return "جيد جداً";
        if (total >= 70) return "جيد";
        if (total >= 50) return "مقبول";
        return "يحتاج متابعة";
      };

      /* =======================================================================
         واجهة 1: شاشة تسجيل الدخول الذكية المخصصة لكل بوابة
      ======================================================================= */
      if (!role) {
        const portalRoles = [
          { id: "student", label: "الطالب", icon: "student", desc: "الدروس 3D والدرجات" },
          { id: "parent", label: "ولي الأمر", icon: "parent", desc: "متابعة الأبناء والحضور" },
          { id: "teacher", label: "المعلم", icon: "teacher", desc: "رصد الدرجات والواجبات" },
          { id: "admin", label: "الإدارة", icon: "admin", desc: "الإشراف العام والتقارير" }
        ];

        return (
          <div className="min-h-[100dvh] flex flex-col justify-center px-4 py-6 max-w-[540px] mx-auto">
            <div className="card p-5 sm:p-6 space-y-5 relative overflow-hidden">
              {/* الشعار الرسمي مع هالة دوّارة */}
              <div className="flex flex-col items-center text-center space-y-2">
                <div className="relative w-[104px] h-[104px] flex items-center justify-center">

      /* =======================================================================
         واجهة 2: التطبيق الداخلي بعد تسجيل الدخول (Header + Portals + AI)

        { id: "lessons", label: "دروسي 3D", icon: "lab3d" },
        { id: "tasks", label: "واجباتي", icon: "tasks" },
        { id: "grades", label: "درجاتي", icon: "grades" },
        { id: "awards", label: "جوائزي", icon: "trophy" },
        { id: "school", label: "مدرستي", icon: "school" },
        { id: "settings", label: "الإعدادات", icon: "settings" }

      const roleTitleMap = {
        student: "بوابة الطالب",
        parent: "بوابة ولي الأمر",
        teacher: "بوابة المعلم",

        student: ["اشرح لي الدرس الحالي", "اختبرني في هذه المادة", "ما هي واجباتي اليوم؟"],

      };

      const getStudentAverage = (student) => {
        const marks = Array.isArray(student?.marks) ? student.marks : [];
        return marks.length ? Math.round(marks.reduce((sum, mark) => sum + (Number(mark.termWork) || 0) + (Number(mark.finalExam) || 0), 0) / marks.length) : 0;
      };
      const currentStudentAverage = getStudentAverage(currentStudent);
      const rankedStudents = [...(data.students || [])].sort((a, b) => getStudentAverage(b) - getStudentAverage(a) || String(a.name || "").localeCompare(String(b.name || ""), "ar"));
      const currentStudentRank = Math.max(0, rankedStudents.findIndex((student) => student.id === currentStudent.id) + 1);
      const parentAttendanceLog = (data.attendanceRecords || [])
        .filter((record) => record?.entries?.[currentStudent.id])
        .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
      const parentAssignments = (data.assignments || []).filter((item) => !item.grade || item.grade === currentStudent.grade);
      const parentSchedule = data.scheduleByGrade?.[currentStudent.grade] || [];
      const parentMessagesForStudent = (data.parentMessages || []).filter((message) =>
        !message.studentId || message.studentId === currentStudent.id || String(message.from || "").includes(currentStudent.name)
      );

      const exportSchoolReport = () => {
        const rows = [
          ["رقم الطالب", "اسم الطالب", "الصف", "الحضور %", "المعدل %"],
          ...(data.students || []).map((student) => [student.id, student.name, student.grade, student.attendance, getStudentAverage(student)])
        ];
        const csv = "\\uFEFF" + rows.map((row) => row.map((value) => '"' + String(value ?? "").replace(/"/g, '""') + '"').join(",")).join("\\r\\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "alnoor-school-report.csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        notify("تم تجهيز تقرير المدرسة بصيغة CSV");
      };

      const replyToParentMessage = (messageId) => {
        const reply = String(adminReplyDrafts[messageId] || "").trim().slice(0, 1200);

        setData((previous) => ({
          ...previous,
          parentMessages: (previous.parentMessages || []).map((message) =>
            message.id === messageId ? { ...message, reply, replyTime: "الآن" } : message

        notify("تم حفظ الرد محلياً");

                        </button>
                        <button
                          type="button"
                          onClick={() => completeLesson(activeLesson)}
                          disabled={activeLesson.completedBy.includes(currentStudent.id)}
                          className="btn btn-olive text-xs py-2 px-4 disabled:opacity-60 disabled:cursor-not-allowed"
                        >
                          {activeLesson.completedBy.includes(currentStudent.id) ? "الدرس مكتمل" : `إتمام الدرس وكسب +${activeLesson.xp} نقطة`}

                {/* تبويب 2: الواجبات والاختبارات */}
                {studentTab === "tasks" && (
                  <div className="space-y-3">
                    {visibleStudentAssignments.map((assign) => {

                  <strong>نسبة إكمال التحضير</strong>
                  <span>{attendanceStudents.length ? Math.round(attendanceStudents.filter((student) => Boolean(getAttendanceStatus(student.id))).length / attendanceStudents.length * 100) : 0}%</span>
                  <small>{attendanceStudents.filter((student) => Boolean(getAttendanceStatus(student.id))).length} من {attendanceStudents.length} طالباً</small>
                </div>
                <button type="button" className="btn btn-olive w-full text-xs" onClick={markAllPresent}>تحضير الكل حاضر</button>
                <div className="space-y-2">
                  {attendanceStudents.map((student) => (
                    <div key={student.id} className="attendance-row">
                      <div className="min-w-0"><div className="text-xs font-black truncate">{student.name}</div><div className="text-[10px] text-[var(--muted)]" dir="ltr">{student.id} · {student.attendance}% حضور</div></div>
                      <div className="attendance-status-buttons" role="group" aria-label={`حالة حضور ${student.name}`}>
                        {[
                          { value: "present", label: "حاضر" },
                          { value: "absent", label: "غائب" },
                          { value: "late", label: "متأخر" }
                        ].map((option) => (
                          <button key={option.value} type="button" aria-pressed={getAttendanceStatus(student.id) === option.value} onClick={() => setAttendanceStatus(student.id, option.value)}>
                            {option.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                  {attendanceStudents.length === 0 && <p className="text-xs font-bold text-[var(--muted)]">لا يوجد طلاب مسجلون في الصف المختار.</p>}
                </div>
                <p className="source-note">تُحسب نسبة الحضور من سجلات الأيام المحفوظة على هذا الجهاز. المتأخر يُحتسب حاضراً، والغائب لا يُحتسب. ستظهر النسبة في بوابة الطالب وولي الأمر عند استخدام المتصفح نفسه.</p>
              </section>
            )}

            {role === "teacher" && teacherTab === "lessons" && (
              <section className="card p-4 space-y-3" aria-label="بنك اختبارات الدروس">
                <h2 className="text-base font-black text-[#E8C84A]">بنك أسئلة الدروس</h2>
                <p className="text-xs font-bold text-[var(--muted)]">الدرس المحدد حالياً: {activeLesson.title}</p>
                <textarea rows="2" maxLength="240" className="input text-sm" placeholder="اكتب سؤالاً قصيراً مرتبطاً بالدرس" value={newQuizQuestion} onChange={(event) => setNewQuizQuestion(event.target.value)} />
                <div className="space-y-2 rounded-xl bg-[var(--surface2)] p-3">
                  {newQuizOptions.map((option, index) => (
                    <div key={index} className="flex items-center gap-2">
                      <input type="radio" name="lesson-quiz-correct" checked={newQuizCorrectIndex === index} onChange={() => setNewQuizCorrectIndex(index)} aria-label={`الإجابة الصحيحة هي الخيار ${index + 1}`} />
                      <input className="input text-xs !py-2" maxLength="180" placeholder={`خيار الإجابة ${index + 1}`} value={option} onChange={(event) => setNewQuizOptions((prev) => prev.map((value, i) => i === index ? event.target.value : value))} />
                    </div>
                  ))}
                </div>
                <button type="button" className="btn btn-olive w-full text-xs" onClick={addQuestionToActiveLesson}>إضافة السؤال إلى بنك هذا الدرس</button>
                <p className="source-note">يظهر السؤال المضاف في اختبار الدرس لدى الطالب في هذا المتصفح. الأسئلة الأولية المولدة آلياً تحتاج مراجعة المعلم قبل اعتمادها تعليمياً.</p>
              </section>
            )}

          </main>

          {/* زر المساعد الذكي العائم (يظهر فقط بعد تسجيل الدخول ومخصص لكل دور) */}
          <button
            type="button"
            onClick={() => setAiOpen((o) => !o)}
            aria-expanded={aiOpen}
            aria-label="فتح مساعد نور"
            className="alnoor-ai-fab flex items-center gap-2 rounded-full font-black text-xs transition-transform hover:scale-105"
          >
            <SmartGlyph name="ai" size={18} color="#2A2118" />
            <span>مساعد نور</span>
          </button>

          {/* نافذة المساعد الذكي المخصصة لكل دور */}
          {aiOpen && (
            <>
              <button type="button" className="alnoor-ai-backdrop" onClick={() => setAiOpen(false)} aria-label="إغلاق مساعد نور" />
              <section className="alnoor-ai-panel card" role="dialog" aria-modal="true" aria-labelledby="alnoor-ai-title">
                <div className="ai-sheet-grabber" aria-hidden="true" />
                <div className="ai-sheet-header">
                  <div className="flex items-center gap-3 min-w-0">
                    <SmartEmojiBadge icon="ai" active size={42} />
                    <div className="min-w-0">
                      <h2 id="alnoor-ai-title" className="text-sm font-black text-[var(--ink)]">مساعد نور</h2>
                      <p className="text-[10px] font-bold text-[var(--muted)]">مساعدك التعليمي • {roleTitleMap[role]}</p>
                    </div>
                  </div>
                  <button type="button" onClick={() => setAiOpen(false)} className="ai-sheet-close" aria-label="إغلاق النافذة">×</button>
                </div>

                <div className="ai-sheet-shortcuts">
                  <div className="text-[11px] font-black text-[var(--muted)] mb-2">اختصارات تناسب بوابتك</div>
                  <div className="grid grid-cols-2 gap-2">
                    {(roleAiPrompts[role] || []).map((prompt, index) => (
                      <button
                        key={index}
                        type="button"
                        disabled={aiBusy}
                        onClick={() => sendAiMessage(prompt)}
                        className="ai-shortcut-button"
                      >
                        {prompt}
                      </button>
                    ))}
                  </div>
                </div>

                <details className="ai-sheet-settings">
                  <summary>إعدادات المطور المتقدمة</summary>
                  <div className="mt-3 space-y-2">
                    <label className="block text-xs font-black" htmlFor="alnoor-proxy-url">رابط الخادم الوسيط (اختياري)</label>
                    <input
                      id="alnoor-proxy-url"
                      type="url"
                      inputMode="url"
                      autoComplete="url"
                      maxLength={500}
                      className="input text-xs"
                      dir="ltr"
                      placeholder="https://your-worker.workers.dev/chat"
                      value={aiSettings.proxyUrl || ""}
                      onChange={(event) => setAiSettings((previous) => ({ proxyUrl: event.target.value.trim().slice(0, 500) }))}
                    />
                    <p className="source-note">اترك الحقل فارغاً لاستخدام اتصال Pollinations العام دون مفتاح. يقبل الوسيط طلب POST يحتوي question و system و context، ويعيد reply أو answer. ضع مفاتيح Gemini أو Groq في أسرار الخادم الوسيط فقط، ولا تضعها هنا.</p>
                    <p className="source-note">الاتصال العام يعتمد على خدمة خارجية وقد يخضع للتوقف أو تحديد الاستخدام. لا ترسل بيانات الطلاب الشخصية عبره. عند تعذر الإنترنت يرجع المساعد إلى دروس هذا الجهاز.</p>
                  </div>
                </details>

                <div className="ai-sheet-history" role="log" aria-live="polite" aria-relevant="additions">
                  {(aiHistoryByRole[role] || []).map((message, index) => (
                    <article
                      key={index}
                      className={`ai-message ${message.sender === "ai" ? "ai-message-assistant" : "ai-message-user"}`}
                    >
                      <p>{message.text}</p>
                      {message.sender === "ai" && (
                        <button type="button" className="ai-read-button" onClick={() => speakAiReply(message.text)}>
                          قراءة الرد صوتياً
                        </button>
                      )}
                    </article>
                  ))}
                  {aiBusy && <div className="ai-thinking" role="status">مساعد نور يجهّز الرد...</div>}
                </div>

                <div className="ai-sheet-composer">
                  <input
                    type="text"
                    maxLength={500}
                    className="input !py-2 text-xs"
                    placeholder="اكتب سؤالك للمساعد..."
                    value={aiInput}
                    onChange={(event) => setAiInput(event.target.value)}
                    onKeyDown={(event) => event.key === "Enter" && sendAiMessage()}
                    aria-label="رسالتك إلى مساعد نور"
                  />
                  <button type="button" disabled={aiBusy} onClick={() => sendAiMessage()} className="ai-send-button">
                    {aiBusy ? "يفكر..." : "إرسال"}
                  </button>
                </div>
              </section>
            </>
          )}

          {/* شريط التنقل السفلي لبوابة الطالب (6 تبويبات متساوية الارتفاع بدون تداخل) */}
          {role === "student" && (
            <nav aria-label="التنقل الرئيسي للطالب" className="student-bottom-nav">
              <div className="student-bottom-nav-inner">
                {studentTabsList.map((tab) => {
                  const isActive = studentTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      type="button"
                      onClick={() => setStudentTab(tab.id)}
                      aria-current={isActive ? "page" : undefined}
                      className={`flex flex-col items-center justify-center py-1 rounded-xl transition-all ${
                        isActive ? "bg-[#5A6B2F]/30" : "opacity-80"
                      }`}
                    >
                      <SmartEmojiBadge icon={tab.icon} active={isActive} size={34} />
                      <span className={`text-[10px] font-black mt-1 ${isActive ? "text-[#E8C84A]" : "text-[var(--muted)]"}`}>
                        {tab.label}
                      </span>
                    </button>
                  );
                })}
              </div>
            </nav>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
