plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alnoor.school'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alnoor.school'
        minSdk 23
        targetSdk 34
        versionCode 113
        versionName '1.1.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}
