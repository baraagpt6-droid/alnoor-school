plugins { id 'com.android.application' }
android {
    namespace 'com.alnoor.school'
    compileSdk 35
    defaultConfig {
        applicationId 'com.alnoor.school'
        minSdk 23
        targetSdk 34
        versionCode 120
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
