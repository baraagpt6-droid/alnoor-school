name: Deploy Alnoor School to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "alnoor-school-release-1.1.1.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release archive
        id: archive
        shell: bash
        run: |
          if [ -f "alnoor-school-release-1.1.1.zip" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Release ZIP is not uploaded yet. Waiting for the archive commit."
          fi

      - name: Assemble site
        if: steps.archive.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          unzip -q "alnoor-school-release-1.1.1.zip" -d site
          rm -rf site/.github
          test -s site/index.html
          test -s site/styles.fixed.css
          test -s site/manifest.json
          python - <<'PY'
          from pathlib import Path
          import os, re
          build_id = os.environ["GITHUB_SHA"][:7]
          version = f"1.1.1+{build_id}"
          html = Path("site/index.html")
          source = html.read_text(encoding="utf-8")
          source, count = re.subn(r'const APP_VERSION = "[^"]+";', f'const APP_VERSION = "{version}";', source, count=1)
          if count != 1:
              raise SystemExit("APP_VERSION marker not found")
          html.write_text(source, encoding="utf-8")
          worker = Path("site/sw.js")
          source = worker.read_text(encoding="utf-8")
          source, count = re.subn(r'const CACHE_VERSION = "[^"]+";', f'const CACHE_VERSION = "alnoor-school-v{version}";', source, count=1)
          if count != 1:
              raise SystemExit("CACHE_VERSION marker not found")
          worker.write_text(source, encoding="utf-8")
          print(f"Publishing {version}")
          PY

      - name: Configure Pages
        if: steps.archive.outputs.found == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.archive.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.archive.outputs.found == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
