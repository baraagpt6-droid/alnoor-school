name: Deploy Alnoor School to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "alnoor-school-release-1.1.1.zip"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release archive
        shell: bash
        run: |
          set -euo pipefail
          echo "3c93f6b6cdcabda0bfbb9d6a47c0c4b2ce90bc58c4c4abaea0214fa702f5cac7  alnoor-school-release-1.1.1.zip" | sha256sum -c -
          unzip -t alnoor-school-release-1.1.1.zip

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          unzip -q alnoor-school-release-1.1.1.zip -d site
          rm -rf site/.github
          test -s site/index.html
          test -s site/styles.fixed.css
          test -s site/manifest.json
          test -s site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
