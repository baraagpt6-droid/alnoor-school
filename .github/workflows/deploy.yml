name: Deploy مدرسة النور 1.2.1 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.json"
      - ".github/workflows/deploy.yml"
      - "alnoor-school-release-1.1.3.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble website
        shell: bash
        run: |
          set -euo pipefail
          unzip -t alnoor-school-release-1.1.3.zip
          rm -rf site
          mkdir -p site
          unzip -q alnoor-school-release-1.1.3.zip -d site
          rm -rf site/.github
          cp index.html sw.js manifest.json site/
          test -s site/index.html
          test -s site/styles.fixed.css
          test -s site/manifest.json
          test -s site/sw.js
          grep -q 'const APP_VERSION = "1.2.1";' site/index.html
          grep -q 'alnoor-school-v1.2.1' site/sw.js

      - name: Bundle local runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/vendor
          curl --retry 3 --retry-delay 2 -fLsS https://unpkg.com/react@18.3.1/umd/react.production.min.js -o site/vendor/react.production.min.js
          curl --retry 3 --retry-delay 2 -fLsS https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js -o site/vendor/react-dom.production.min.js
          curl --retry 3 --retry-delay 2 -fLsS https://unpkg.com/@babel/standalone@7.26.10/babel.min.js -o site/vendor/babel.min.js
          curl --retry 3 --retry-delay 2 -fLsS https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o site/vendor/three.min.js
          curl --retry 3 --retry-delay 2 -fLsS https://unpkg.com/qrcode-generator@1.4.4/qrcode.js -o site/vendor/qrcode.min.js
          for file in react.production.min.js react-dom.production.min.js babel.min.js three.min.js qrcode.min.js; do test -s "site/vendor/$file"; done

      - name: Stamp build identity and cache version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os, re
          build_id = os.environ["GITHUB_SHA"][:7]
          version = f"1.2.1+{build_id}"
          html = Path("site/index.html")
          source = html.read_text(encoding="utf-8")
          source, count = re.subn(r'const APP_VERSION = "[^"]+";', f'const APP_VERSION = "{version}";', source, count=1)
          if count != 1:
              raise SystemExit("APP_VERSION marker not found")
          html.write_text(source, encoding="utf-8")
          worker = Path("site/sw.js")
          source = worker.read_text(encoding="utf-8")
          source, count = re.subn(r'const CACHE_VERSION = "[^"]+";', f'const CACHE_VERSION = "alnoor-school-v{version}";', source, count=1)
          if count != 1:
              raise SystemExit("CACHE_VERSION marker not found")
          worker.write_text(source, encoding="utf-8")
          print(f"Publishing version {version}")
          PY
          grep -q 'vendor/qrcode.min.js' site/index.html
          grep -q 'alnoor-school-v1.2.1+' site/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website source bundle
        uses: actions/upload-artifact@v4
        with:
          name: alnoor-school-1.2.1-website
          path: site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
