name: Build Alnoor cloud function bundle

on:
  pull_request:
    branches: [main]
    paths:
      - "cloud-api/**"
      - ".github/workflows/build-neon-function.yml"
  push:
    branches: [main]
    paths:
      - "cloud-api/**"
      - ".github/workflows/build-neon-function.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: cloud-api
        run: npm install --no-audit --no-fund
      - name: Bundle function for Neon Node.js 24
        working-directory: cloud-api
        run: |
          set -euo pipefail
          npx esbuild src/index.mjs --bundle --platform=node --target=node24 --format=esm --banner:js='import { createRequire } from "node:module"; const require = createRequire(import.meta.url);' --outfile=dist/index.mjs
          test -s dist/index.mjs
          mkdir -p bundle
          cp dist/index.mjs bundle/index.mjs
          (cd bundle && zip -q -X ../alnoor-schoolapi-2.0.2.zip index.mjs)
          unzip -t alnoor-schoolapi-2.0.2.zip
          sha256sum alnoor-schoolapi-2.0.2.zip
      - name: Stage temporary base64 deployment payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .neon-deploy-staging
          base64 -w 0 cloud-api/alnoor-schoolapi-2.0.2.zip > .neon-deploy-staging/alnoor-schoolapi-2.0.2.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .neon-deploy-staging/alnoor-schoolapi-2.0.2.zip.b64
          git commit -m "Temporarily stage Neon 2.0.2 deployment payload"
          git push origin HEAD:main
      - name: Upload Neon function bundle
        uses: actions/upload-artifact@v4
        with:
          name: alnoor-schoolapi-2.0.2-bundle
          path: cloud-api/alnoor-schoolapi-2.0.2.zip
          if-no-files-found: error
          retention-days: 7
