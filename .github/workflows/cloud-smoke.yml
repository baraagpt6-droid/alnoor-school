name: Alnoor School 2.0.3 production smoke test

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.json"
      - "cloud-api/src/index.mjs"
      - ".github/workflows/cloud-smoke.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-and-cors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check SchoolAPI health and database
        shell: bash
        run: |
          set -euo pipefail
          API="https://br-falling-rain-azmx7t48-schoolapi.compute.c-3.ap-southeast-1.aws.neon.tech"
          BODY="$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 30 -fsS "$API/api/health")"
          echo "SchoolAPI health response: $BODY"
          echo "$BODY" | jq -e '.ok == true and .version == "2.0.3" and .database.database == "neondb"' >/dev/null
          echo "SchoolAPI health and database connection passed."

      - name: Verify GitHub Pages production site and PWA
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://baraagpt6-droid.github.io/alnoor-school"
          HTML="$(curl --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 15 --max-time 45 -fsSL "$SITE/")"
          echo "$HTML" | grep -F 'const APP_VERSION = "2.0.3+'
          MANIFEST="$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 30 -fsSL "$SITE/manifest.json")"
          POLICY="$(curl --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 15 --max-time 45 -fsSL "$SITE/privacy.html")"
          echo "$POLICY" | grep -F "سياسة الخصوصية"
          echo "$MANIFEST" | jq -e '.name | contains("مدرسة النور")' >/dev/null
          WORKER="$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 30 -fsSL "$SITE/sw.js")"
          echo "$WORKER" | grep -F 'alnoor-school-v2.0.3+'
          echo "GitHub Pages site, manifest, and PWA service worker passed."

      - name: Check browser and Android CORS origins
        shell: bash
        run: |
          set -euo pipefail
          API="https://br-falling-rain-azmx7t48-schoolapi.compute.c-3.ap-southeast-1.aws.neon.tech"
          for ORIGIN in \
            "https://baraagpt6-droid.github.io" \
            "http://localhost:5173" \
            "http://localhost:8080" \
            "capacitor://localhost" \
            "ionic://localhost" \
            "null"; do
            HEADERS="$(curl --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 30 -fsS -D - -o /dev/null -H "Origin: $ORIGIN" "$API/api/health")"
            if [ "$ORIGIN" = "null" ]; then
              echo "$HEADERS" | grep -Fai "access-control-allow-origin: *"
            else
              echo "$HEADERS" | grep -Fai "access-control-allow-origin: $ORIGIN"
            fi
            echo "CORS passed for Origin: $ORIGIN"
          done

      - name: Authenticate all four preview roles
        shell: bash
        run: |
          set -euo pipefail
          API="https://br-falling-rain-azmx7t48-schoolapi.compute.c-3.ap-southeast-1.aws.neon.tech"
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("index.html", "utf8");
          const credentials = {};
          for (const role of ["admin", "teacher", "student", "parent"]) {
            const pattern = new RegExp(role + ':\\s*Object\\.freeze\\(\\{\\s*id:\\s*"([^"]+)",\\s*secret:\\s*"([^"]+)"');
            const match = html.match(pattern);
            if (!match) throw new Error("Missing preview credentials for " + role);
            credentials[role] = { id: match[1], password: match[2] };
          }
          fs.writeFileSync(process.env.RUNNER_TEMP + "/alnoor-demo-credentials.json", JSON.stringify(credentials));
          NODE
          for ROLE in admin teacher student parent; do
            LOGIN_ID="$(jq -r ".$ROLE.id" "$RUNNER_TEMP/alnoor-demo-credentials.json")"
            PASSWORD="$(jq -r ".$ROLE.password" "$RUNNER_TEMP/alnoor-demo-credentials.json")"
            BODY="$(jq -n --arg id "$LOGIN_ID" --arg role "$ROLE" --arg password "$PASSWORD" '{login_id:$id,role:$role,password:$password}' | curl --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 30 -fsS -H 'Origin: https://baraagpt6-droid.github.io' -H 'Content-Type: application/json' -d @- "$API/api/auth/login")"
            TOKEN="$(echo "$BODY" | jq -r '.token // empty')"
            test -n "$TOKEN"
            ME="$(curl --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 30 -fsS -H "Authorization: Bearer $TOKEN" "$API/api/me")"
            echo "$ME" | jq -e --arg role "$ROLE" --arg id "$LOGIN_ID" '.user.role == $role and .user.login_id == $id' >/dev/null
            echo "ALNOOR_TOKEN_$ROLE=$TOKEN" >> "$GITHUB_ENV"
            echo "Cloud login verified for role: $ROLE"
          done

      - name: Verify Neon Realtime token issuance
        shell: bash
        run: |
          set -euo pipefail
          API="https://br-falling-rain-azmx7t48-schoolapi.compute.c-3.ap-southeast-1.aws.neon.tech"
          BODY="$(curl --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 30 -fsS -X POST -H "Authorization: Bearer $ALNOOR_TOKEN_admin" -H 'Content-Type: application/json' -d '{}' "$API/api/realtime/seal")"
          echo "$BODY" | jq -e 'has("sealed") and (.sealed != null)' >/dev/null
          echo "Neon Realtime token issuance passed."

      - name: Verify snapshot synchronization for every role (read-only)
        shell: bash
        run: |
          set -euo pipefail
          API="https://br-falling-rain-azmx7t48-schoolapi.compute.c-3.ap-southeast-1.aws.neon.tech"
          for ROLE in admin teacher student parent; do
            TOKEN_VAR="ALNOOR_TOKEN_$ROLE"
            TOKEN="${!TOKEN_VAR}"
            SNAPSHOT="$(curl --retry 2 --retry-delay 1 --connect-timeout 15 --max-time 30 -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{}' "$API/api/sync/pull")"
            echo "$SNAPSHOT" | jq -e '(.students | type == "array") and (.lessons | type == "array") and (.assignments | type == "array")' >/dev/null
            echo "Cloud snapshot pull verified for role: $ROLE"
          done

      - name: Verify Noor Assistant API response
        shell: bash
        run: |
          set -euo pipefail
          API="https://br-falling-rain-azmx7t48-schoolapi.compute.c-3.ap-southeast-1.aws.neon.tech"
          BODY="$(curl --retry 1 --retry-delay 2 --connect-timeout 15 --max-time 40 -fsS -X POST -H "Authorization: Bearer $ALNOOR_TOKEN_admin" -H 'Content-Type: application/json' -d '{"question":"اكتب جملة عربية قصيرة تؤكد نجاح الاتصال."}' "$API/api/assistant")"
          echo "$BODY" | jq -e '.reply | strings | length > 0' >/dev/null
          echo "Noor Assistant API returned a non-empty reply. Provider: $(echo "$BODY" | jq -r '.provider // "unknown"')"
