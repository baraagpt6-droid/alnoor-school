name: Build Alnoor School Android APK

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Add School launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          unzip -p alnoor-school-release-1.1.3.zip logo-512.png > android/app/src/main/res/drawable-nodpi/ic_launcher.png
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" alnoor-school-1.1.3.apk
          sha256sum alnoor-school-1.1.3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alnoor-school-1.1.3-apk
          path: alnoor-school-1.1.3.apk
          if-no-files-found: error
          retention-days: 30
