name: Build Alnoor School Android APK 1.2.0

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.json"
      - "android/**"
      - ".github/workflows/build-android.yml"
      - "alnoor-school-release-1.1.3.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is not preinstalled on this runner}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Package the website inside Android
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="android/app/src/main/assets/www"
          mkdir -p "$ASSET_DIR/vendor" android/app/src/main/res/drawable-nodpi
          unzip -q alnoor-school-release-1.1.3.zip -d "$ASSET_DIR"
          rm -rf "$ASSET_DIR/.github"
          cp index.html sw.js manifest.json "$ASSET_DIR/"
          curl --retry 3 --retry-delay 2 -fLsS https://unpkg.com/react@18.3.1/umd/react.production.min.js -o "$ASSET_DIR/vendor/react.production.min.js"
          curl --retry 3 --retry-delay 2 -fLsS https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js -o "$ASSET_DIR/vendor/react-dom.production.min.js"
          curl --retry 3 --retry-delay 2 -fLsS https://unpkg.com/@babel/standalone@7.26.10/babel.min.js -o "$ASSET_DIR/vendor/babel.min.js"
          curl --retry 3 --retry-delay 2 -fLsS https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o "$ASSET_DIR/vendor/three.min.js"
          curl --retry 3 --retry-delay 2 -fLsS https://unpkg.com/qrcode-generator@1.4.4/qrcode.js -o "$ASSET_DIR/vendor/qrcode.min.js"
          cp "$ASSET_DIR/logo-512.png" android/app/src/main/res/drawable-nodpi/ic_launcher.png
          for file in index.html styles.fixed.css logo.png manifest.json sw.js vendor/react.production.min.js vendor/react-dom.production.min.js vendor/babel.min.js vendor/three.min.js vendor/qrcode.min.js; do test -s "$ASSET_DIR/$file"; done

      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify APK and package ID
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.alnoor.school'"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$APK" alnoor-school-1.2.0-unsigned-aligned.apk
          test -s alnoor-school-1.2.0-unsigned-aligned.apk
          sha256sum alnoor-school-1.2.0-unsigned-aligned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alnoor-school-1.2.0-unsigned-apk
          path: alnoor-school-1.2.0-unsigned-aligned.apk
          if-no-files-found: error
          retention-days: 30
